<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk - Koperasi Pinjaman</title>
  <style>
    :root { --bg:#f5f7fa; --kartu:#fff; --teks:#1f2937; --redup:#6b7280; --garis:#e5e7eb; --utama:#0f766e; --bahaya:#b91c1c; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--teks); }
    .kotak { width:100%; max-width:380px; background:var(--kartu); border:1px solid var(--garis); border-radius:12px; padding:28px; }
    h1 { font-size:22px; margin:0 0 4px; color:var(--utama); }
    p { margin:0 0 20px; color:var(--redup); font-size:14px; }
    label { display:block; font-size:13px; color:var(--redup); margin-bottom:4px; }
    input[type=text], input[type=password] { width:100%; padding:10px 12px; border:1px solid var(--garis); border-radius:8px; font-size:15px; margin-bottom:16px; }
    input:focus { outline:2px solid var(--utama); border-color:transparent; }
    button { width:100%; background:var(--utama); color:#fff; border:0; padding:11px; border-radius:8px; font-size:15px; cursor:pointer; }
    .galat { background:#fee2e2; color:var(--bahaya); padding:10px 12px; border-radius:8px; font-size:14px; margin-bottom:16px; }
    .demo { margin-top:20px; padding-top:16px; border-top:1px solid var(--garis); font-size:13px; color:var(--redup); }
  </style>
</head>
<body>
  <div class="kotak">
    <h1>Koperasi Pinjaman</h1>
    <p>Masuk untuk mengelola pinjaman dan kas.</p>
    {% if form.errors %}
    <div class="galat">Username atau kata sandi salah.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" autofocus autocomplete="username" required>
      <label for="id_password">Kata sandi</label>
      <input type="password" name="password" id="id_password" autocomplete="current-password" required>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Masuk</button>
    </form>
    <div class="demo">Akun demo: <strong>kasir</strong> atau <strong>pengurus</strong> (kata sandi: demo12345)</div>
  </div>
</body>
</html>
